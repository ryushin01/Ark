name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 검사 목록은 scripts/check.mjs 한 곳에 있습니다. 작업마다 `pnpm check <묶음>`을 부르고, 로컬에서는 `pnpm check`로 같은 검사를 돌립니다.
# 빌드는 build 작업에서 한 번만 하고(.next/cache를 캐시), 결과물을 E2E·시각 회귀·Lighthouse가 받아 다시 씁니다.
# 토큰이 필요한 원격 캐시는 쓰지 않습니다(GitHub Actions 캐시만).
jobs:
  # 바뀐 파일이 Markdown(README·CHANGELOG·docs 등)뿐이면 E2E·Lighthouse 같은 무거운 검사를 건너뜁니다.
  # 코드·설정·데이터·이미지가 하나라도 바뀌면 모든 검사를 돕니다.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qv '\.md$'; then echo "docs_only=true" >> "$GITHUB_OUTPUT"; else echo "docs_only=false" >> "$GITHUB_OUTPUT"; fi

  # 이름은 main 보호 규칙의 필수 검사이므로 바꾸지 않습니다.
  check:
    name: Lint · Format · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 버전은 package.json의 packageManager를 따름
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint → lint:fsd → format:check → typecheck → test:coverage → 커버리지 표(작업 요약)
      - run: pnpm check static

  build:
    name: Storybook test · Build · Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Playwright 브라우저는 버전별로 캐시하고, 캐시가 있으면 시스템 의존성만 설치합니다.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Next.js 빌드 캐시. 의존성과 소스가 같으면 그대로, 소스만 바뀌면 의존성 기준의 이전 캐시를 이어 씁니다.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts', 'public/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # test:storybook → build → size
      - run: pnpm check build
      # 빌드 결과(.next, Storybook)를 한 파일로 묶어 다음 작업에 넘깁니다. 캐시 폴더는 빼고 넘깁니다.
      - run: tar -czf build.tgz --exclude=.next/cache .next public/storybook
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tgz
          retention-days: 1
          compression-level: 0

  # 프로덕션 빌드에서 화면 폭별 넘침, 접근성(axe), 키보드 동작, 오프라인을 검사합니다. 세 조각으로 나눠 동시에 돕니다.
  # 어드민은 메모리 데이터를 바꾸므로 공개 화면과 다른 조각(자기 서버)에서 돕니다(--no-deps).
  e2e:
    name: E2E (${{ matrix.shard.name }})
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: "공개 1/2", args: "--project=chromium --shard=1/2" }
          - { name: "공개 2/2", args: "--project=chromium --shard=2/2" }
          - { name: "어드민·오프라인", args: "--project=admin --project=offline --no-deps" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      - run: pnpm check e2e -- ${{ matrix.shard.args }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 시각 회귀(toHaveScreenshot)와 Web Vitals. 기준 이미지와 같은 환경이 되도록 Playwright 공식 Docker 이미지에서 돕니다.
  # 이미지 태그의 버전은 package.json의 @playwright/test와 같아야 합니다.
  visual:
    name: Visual · Web Vitals
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      # 컨테이너 안은 root라 Chromium이 HOME 아래에 쓰도록 맞춥니다.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      - run: pnpm check visual vitals
      # 실패하면 차이 이미지(…-diff.png)와 새 이미지(…-actual.png)를 올립니다. 화면을 일부러 바꿨으면 새 이미지를 기준으로 씁니다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-visual
          # 기준 이미지가 없으면 Playwright가 e2e/__screenshots__에 새로 써 두므로 함께 올립니다.
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      # 러너에 설치된 Chrome으로 잽니다.
      - run: pnpm check lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse
          # .lighthouseci는 숨김 폴더라 따로 켜야 올라갑니다.
          include-hidden-files: true
          path: .lighthouseci/
          retention-days: 7

  upload:
    name: Upload E2E (local Supabase)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - run: pnpm install --frozen-lockfile
      # 로컬 Supabase(DB·Storage)를 띄우고, 접속 정보를 다음 단계의 환경 변수로 넘깁니다.
      - run: supabase start
      - name: Export local Supabase env
        run: |
          supabase status -o env > /tmp/supabase.env
          echo "SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$(grep '^SECRET_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
      # 운영 배포(release.yml)가 쓰는 콘텐츠 반영 SQL(반영 기록 포함)이 실제 DB에서 도는지 확인합니다. 두 번 넣어도 같아야 합니다.
      - name: Content sync SQL (local DB)
        run: |
          # supabase db query는 여러 문장을 한 번에 실행하지 못해 러너에 있는 psql을 씁니다.
          DB_URL=$(grep '^DB_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          pnpm exec tsx scripts/seed-sync.mts --all --record "$(git rev-parse HEAD)" > /tmp/sync.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f /tmp/sync.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f /tmp/sync.sql
      # 이 러너 안의 로컬 Supabase에만 동시 읽기 부하를 주고 응답 시간을 작업 요약에 적습니다(운영 DB는 건드리지 않음).
      - run: pnpm load:local-db
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # 로컬 Supabase 주소로 빌드해야 업로드한 이미지(127.0.0.1)를 최적화할 수 있습니다. 공개 빌드와 캐시를 나눕니다.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-local-db-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts', 'public/**') }}
          restore-keys: nextjs-local-db-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm test:e2e:local-db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-upload
          path: |
            playwright-report/
            test-results/
          retention-days: 7
