name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Storybook test · Build · E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager를 따름
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:fsd
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - run: pnpm build
      # 프로덕션 빌드에서 화면 폭별 넘침, 접근성(axe), 키보드 동작을 검사
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  upload:
    name: Upload E2E (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: pnpm install --frozen-lockfile
      # 로컬 Supabase(DB·Storage)를 띄우고, 접속 정보를 다음 단계의 환경 변수로 넘깁니다.
      - run: supabase start
      - name: Export local Supabase env
        run: |
          supabase status -o env > /tmp/supabase.env
          echo "SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$(grep '^SECRET_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
      # 로컬 Supabase 주소로 빌드해야 업로드한 이미지(127.0.0.1)를 최적화할 수 있습니다.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:local-db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-upload
          path: |
            playwright-report/
            test-results/
          retention-days: 7
