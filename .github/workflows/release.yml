name: Release

# main의 CI가 통과하면 운영 DB를 먼저 맞추고 나서 Vercel 운영 배포를 부릅니다.
# 순서: 마이그레이션 → 코드에서 바뀐 콘텐츠 반영 → 반영한 커밋 기록 → Vercel 배포 훅
# 새 테이블·새 데이터를 쓰는 화면을 미리 그리는 빌드가 빈 DB를 읽어 실패하지 않게 합니다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 운영 반영은 한 번에 하나씩, 진행 중인 것은 취소하지 않습니다.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Migrate · Sync content · Deploy
    # 손으로 돌릴 때(workflow_dispatch)도 main에서만 운영에 반영합니다.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # 마지막으로 운영 DB에 반영한 커밋을 가리키는 브랜치
      SYNCED_REF: release/db-synced
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile

      # 기준: 지난번에 반영한 커밋. 처음이면 바로 앞 커밋.
      # CI가 늦게 끝난 오래된 커밋(이미 반영한 커밋의 조상)이면 운영을 되돌리지 않도록 아무것도 하지 않습니다.
      - name: Base commit
        id: base
        run: |
          if git rev-parse --verify -q "origin/$SYNCED_REF" > /dev/null; then
            BASE=$(git rev-parse "origin/$SYNCED_REF")
          else
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "기준 커밋: $BASE" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$BASE" HEAD; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "이번 커밋이 이미 반영한 커밋보다 오래되어 건너뜁니다." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrations
        if: steps.base.outputs.skip == 'false'
        run: supabase db push --remote="$SUPABASE_DB_URL" --yes

      - name: Content sync
        if: steps.base.outputs.skip == 'false'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add --detach /tmp/base "$BASE"
          if ! pnpm exec tsx scripts/seed-sync.mts /tmp/base > /tmp/sync.sql 2> /tmp/sync.log; then
            cat /tmp/sync.log >&2
            exit 1
          fi
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/sync.log
          if [ -s /tmp/sync.sql ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f /tmp/sync.sql
          else
            echo "바뀐 콘텐츠 없음" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # 기록은 "운영 DB에 반영한 커밋"입니다. DB에 넣은 직후, 배포 전에 옮겨 다음 실행의 비교 기준이 실제 DB와 같게 합니다.
      # 배포가 실패하면 이 실행이 실패로 보이고, Release를 다시 돌리면 DB는 그대로 두고(바뀐 행 없음) 배포만 다시 합니다.
      - name: Record synced commit
        if: steps.base.outputs.skip == 'false'
        run: git push --force origin "HEAD:refs/heads/$SYNCED_REF"

      - name: Deploy (Vercel deploy hook)
        if: steps.base.outputs.skip == 'false'
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" > /dev/null
