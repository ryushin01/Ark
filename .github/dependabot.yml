# 의존성 자동 업데이트 (Dependabot)
# - 같은 메이저 안의 패치·마이너만 주 1회 PR로 받습니다. 메이저 업그레이드는 직접 계획해서 진행합니다.
# - 출시 후 14일이 지난 버전만 제안합니다. (갓 나온 버전의 문제를 피함)
# - PR마다 CI(린트·타입·단위·스토리·빌드·E2E·업로드 E2E)가 돌므로, 통과한 PR만 합칩니다.
version: 2
updates:
  - package-ecosystem: npm # pnpm(pnpm-lock.yaml)도 npm 생태계로 처리
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @types/node는 CI의 Node(22, .nvmrc)와 같은 메이저로 유지
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      # 운영 의존성과 개발 도구를 나눠서 한 PR씩
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: github-actions # CI 워크플로의 액션
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
